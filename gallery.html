<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Pages & Pour</title>
  <meta name="description" content="Pages & Pour is an educational bookstore with a coffee shop and study spot: books, school materials, and a comfortable place to learn, all in one place. One Place. Every Page. Every Pour." />
  <link rel="icon" href="assets/logo-mark-clear.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#top">Skip to content</a>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <header class="nav solid">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <img src="assets/logo-mark-clear.png" alt="Pages & Pour mark" />
        Pages & Pour
      </a>
      <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks">
        <span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="offerings.html">Offerings</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="owners.html">Owners</a></li>
        <li><a href="brand.html">Brand</a></li>
        <li><a class="nav-cta" href="visit.html">Visit</a></li>
      </ul>
    </div>
  </header>

  <main id="top">
    <section id="gallery" class="page-first">
      <div class="wrap">
        <div class="section-head reveal">
          <p class="eyebrow">Gallery</p>
          <h1 class="page-title">Inside Pages & Pour.</h1>
        </div>
        <div class="gallery">
          <figure class="g-item g-wide">
            <img loading="lazy" decoding="async" src="assets/product-study.jpg" alt="Long curved bookshelves in a quiet study space" data-zoom data-gallery />
            <figcaption>Shelves & study space</figcaption>
          </figure>
          <figure class="g-item g-tall">
            <img loading="lazy" decoding="async" src="assets/product-books.jpg" alt="Stack of books on a table" data-zoom data-gallery />
            <figcaption>Books & school materials</figcaption>
          </figure>
          <figure class="g-item">
            <img loading="lazy" decoding="async" src="assets/hero-cafe.jpg" alt="Café table by the window with a coffee press and cups" data-zoom data-gallery />
            <figcaption>Café atmosphere</figcaption>
          </figure>
          <figure class="g-item">
            <img loading="lazy" decoding="async" src="assets/product-coffee.jpg" alt="Four hands holding cups of coffee with latte art" data-zoom data-gallery />
            <figcaption>Coffee</figcaption>
          </figure>
          <figure class="g-item">
            <img loading="lazy" decoding="async" src="assets/pastry.jpg" alt="Fresh pastries" data-zoom data-gallery />
            <figcaption>Pastries</figcaption>
          </figure>
          <figure class="g-item">
            <img loading="lazy" decoding="async" src="assets/brand-post.jpg" alt="First Pages & Pour brand post" data-zoom data-gallery />
            <figcaption>The Pages & Pour brand</figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer reveal fade">
    <img loading="lazy" decoding="async" src="assets/logo-mark-clear.png" alt="" />
    <p>Pages & Pour · An Educational Bookstore with a Coffee Shop · Est. 2026</p>
    <p>One Place. Every Page. Every Pour.</p>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="offerings.html">Offerings</a>
      <a href="menu.html">Menu</a>
      <a href="gallery.html">Gallery</a>
      <a href="owners.html">Owners</a>
      <a href="brand.html">Brand</a>
      <a href="visit.html">Visit</a>
      <a href="visit.html#contactForm" data-action="contact">Contact</a>
    </div>
    <div class="footer-social" id="footerSocial"></div>
  </footer>

  <button class="to-top" id="toTop" type="button" aria-label="Back to top">↑</button>
  <div class="toast" id="toast" role="status"></div>
  <dialog class="lightbox" id="lightbox" aria-label="Image preview">
    <button class="btn btn-small lightbox-close" type="button" id="lightboxClose">Close</button>
    <button class="lightbox-nav prev" type="button" id="lightboxPrev" aria-label="Previous image">‹</button>
    <figure>
      <img loading="lazy" decoding="async" id="lightboxImg" alt="" />
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
    <button class="lightbox-nav next" type="button" id="lightboxNext" aria-label="Next image">›</button>
  </dialog>

  <script src="site-data.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
